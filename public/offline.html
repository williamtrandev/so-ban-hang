<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mất kết nối</title>
    <style>
      body {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        margin: 0;
        background: #f4f8f5;
        color: #1b2620;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p { color: #5f6b64; }
      @media (prefers-color-scheme: dark) {
        body { background: #090d0b; color: #f3f6f4; }
        p { color: #a3ada7; }
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Không có kết nối mạng</h1>
      <p>Vào lại khi có mạng để nhập đơn hoặc quyết toán.</p>
    </div>
  </body>
</html>
